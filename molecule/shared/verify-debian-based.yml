---
- name: Verify debian based systems
  hosts: all
  tasks:
  - name: Verify FRR package is installed
    ansible.builtin.package_facts:
      manager: apt

  - name: Assert FRR is installed
    ansible.builtin.assert:
      that: "'frr' in ansible_facts.packages"
      fail_msg: "frr package not installed"

  - name: Legacy APT keyring check
    when: >
      (
        ansible_distribution == "Debian" and
        ansible_distribution_major_version|int <= 12
      ) or
      (
        ansible_distribution == "Ubuntu" and
        ansible_distribution_major_version|int <= 24
      )
    block:
      - name: Stat legacy APT keyring
        ansible.builtin.stat:
          path: /etc/apt/trusted.gpg
        register: _frr_verify_legacy_keyring

      - name: Assert legacy keyring is populated
        ansible.builtin.assert:
          that:
            - _frr_verify_legacy_keyring.stat.exists
            - _frr_verify_legacy_keyring.stat.size > 0
          fail_msg: "/etc/apt/trusted.gpg does not exist or is empty"

  - name: Modern APT keyring check
    when: >
      (
        ansible_distribution == "Debian" and
        ansible_distribution_major_version|int > 12
      ) or
      (
        ansible_distribution == "Ubuntu" and
        ansible_distribution_major_version|int > 24
      )
    block:
      - name: Assert signed-by keyring file exists
        ansible.builtin.stat:
          path: /etc/apt/keyrings/frrouting.gpg
        register: _frr_verify_keyring_stat

      - name: Assert keyring is populated
        ansible.builtin.assert:
          that:
            - _frr_verify_keyring_stat.stat.exists
            - _frr_verify_keyring_stat.stat.size > 0
          fail_msg: "/etc/apt/keyrings/frrouting.gpg does not exist or is empty"

  - name: Get status of frr service
    ansible.builtin.service_facts:

  - name: Assert frr service enabled and running
    ansible.builtin.assert:
      that:
        - ansible_facts.services['frr.service'].state == 'running'
        - ansible_facts.services['frr.service'].status == 'enabled'
      fail_msg: "frr service is not running or not enabled"

  - name: Validate the applied /etc/frr/frr.conf with vtysh
    become: true
    ansible.builtin.command:
      cmd: vtysh -C -f /etc/frr/frr.conf
    register: frr_conf_applied_validation
    changed_when: false

  - name: Assert the applied /etc/frr/frr.conf is valid
    ansible.builtin.assert:
      that:
        - frr_conf_applied_validation.rc == 0
      fail_msg: "Applied /etc/frr/frr.conf failed vtysh validation"

  - name: Record checksum of the currently applied /etc/frr/frr.conf
    become: true
    ansible.builtin.stat:
      path: /etc/frr/frr.conf
      checksum_algorithm: sha256
    register: frr_conf_before_negative_test

  - name: Attempt to apply an intentionally invalid FRR configuration
    become: true
    vars:
      frr_access_list:
        - "this is not valid frr syntax !!!"
    block:
      - name: Include config tasks with an intentionally invalid FRR configuration
        ansible.builtin.include_role:
          name: ansible-frr
          tasks_from: config
    rescue:
      - name: Record that the invalid FRR configuration was rejected
        ansible.builtin.set_fact:
          frr_config_negative_test_rejected: true

  - name: Assert the invalid FRR configuration was rejected
    ansible.builtin.assert:
      that:
        - frr_config_negative_test_rejected | default(false)
      fail_msg: "Invalid FRR configuration was not rejected by vtysh validation"

  - name: Record checksum of /etc/frr/frr.conf after the negative test
    become: true
    ansible.builtin.stat:
      path: /etc/frr/frr.conf
      checksum_algorithm: sha256
    register: frr_conf_after_negative_test

  - name: Assert /etc/frr/frr.conf was not modified by the failed validation
    ansible.builtin.assert:
      that:
        - frr_conf_after_negative_test.stat.checksum == frr_conf_before_negative_test.stat.checksum
      fail_msg: "/etc/frr/frr.conf was modified despite failing vtysh validation"

  - name: Find any leftover staged FRR configuration files
    become: true
    ansible.builtin.find:
      paths: /tmp
      patterns: "*.frr.conf"
    register: frr_conf_staged_leftovers

  - name: Assert no staged FRR configuration files were left behind
    ansible.builtin.assert:
      that:
        - frr_conf_staged_leftovers.files | length == 0
      fail_msg: "Staged FRR configuration files were left behind in /tmp"

  - name: Slurp the applied /etc/frr/frr.conf for OSPF duplication check
    become: true
    ansible.builtin.slurp:
      src: /etc/frr/frr.conf
    register: frr_conf_slurp

  - name: Assert exactly one router ospf block exists for the default VRF
    vars:
      frr_conf_content: "{{ frr_conf_slurp.content | b64decode }}"
      frr_conf_router_ospf_lines: "{{ frr_conf_content.splitlines() | select('equalto', 'router ospf') | list }}"
    ansible.builtin.assert:
      that:
        - frr_conf_router_ospf_lines | length == 1
      fail_msg: >-
        Expected exactly one 'router ospf' block for the default VRF but found
        {{ frr_conf_router_ospf_lines | length }}

  - name: Render frr.conf for OSPF VRF-only scenario (frr_ospf empty, frr_ospf_vrf_enabled populated)
    vars:
      _frr_role_defaults: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') + '/defaults/main.yml') | from_yaml }}"
      frr_daemons:
        bfdd: false
        bgpd: false
        isisd: false
        ldpd: false
        nhrpd: false
        ospf6d: false
        ospfd: true
        pimd: false
        ripd: false
        ripngd: false
        zebra: true
      frr_router_id: 1.1.1.1
      frr_password: "{{ _frr_role_defaults.frr_password }}"
      frr_logging: "{{ _frr_role_defaults.frr_logging }}"
      frr_ospf: {}
      frr_ospf_vrf_enabled:
        blue:
          areas:
            0:
              networks:
                - 10.10.0.0/24
    block:
      - name: Create staging file for OSPF VRF-only rendering check
        ansible.builtin.tempfile:
          state: file
          suffix: .frr-ospf-vrf.conf
        register: frr_conf_ospf_vrf_staged
        changed_when: false

      - name: Render frr.conf.j2 with VRF-only OSPF config
        ansible.builtin.template:
          src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/etc/frr/frr.conf.j2"
          dest: "{{ frr_conf_ospf_vrf_staged.path }}"
          mode: "0600"
        changed_when: false

      - name: Validate the rendered VRF-only frr.conf with vtysh
        ansible.builtin.command:
          cmd: "vtysh -C -f {{ frr_conf_ospf_vrf_staged.path }}"
        register: frr_conf_ospf_vrf_validation
        changed_when: false

      - name: Assert the rendered VRF-only frr.conf is valid
        ansible.builtin.assert:
          that:
            - frr_conf_ospf_vrf_validation.rc == 0
          fail_msg: "Rendered VRF-only frr.conf failed vtysh validation"

      - name: Slurp the rendered VRF-only frr.conf
        ansible.builtin.slurp:
          src: "{{ frr_conf_ospf_vrf_staged.path }}"
        register: frr_conf_ospf_vrf_slurp

      - name: Assert no bare default-VRF router ospf stanza is rendered
        vars:
          frr_conf_ospf_vrf_content: "{{ frr_conf_ospf_vrf_slurp.content | b64decode }}"
          frr_conf_ospf_vrf_bare_lines: "{{ frr_conf_ospf_vrf_content.splitlines() | select('equalto', 'router ospf') | list }}"
        ansible.builtin.assert:
          that:
            - frr_conf_ospf_vrf_bare_lines | length == 0
            - "'router ospf vrf blue' in frr_conf_ospf_vrf_content"
          fail_msg: >-
            Expected no bare default-VRF 'router ospf' stanza when only
            frr_ospf_vrf_enabled is set, but found
            {{ frr_conf_ospf_vrf_bare_lines | length }}
    always:
      - name: Remove staged OSPF VRF-only rendering file
        ansible.builtin.file:
          path: "{{ frr_conf_ospf_vrf_staged.path }}"
          state: absent
        changed_when: false
        when:
          - frr_conf_ospf_vrf_staged is defined
          - frr_conf_ospf_vrf_staged.path is defined

  - name: Render frr.conf for OSPF disabled scenario (ospfd false, frr_ospf and frr_ospf_vrf_enabled populated)
    vars:
      _frr_role_defaults: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') + '/defaults/main.yml') | from_yaml }}"
      frr_daemons:
        bfdd: false
        bgpd: false
        isisd: false
        ldpd: false
        nhrpd: false
        ospf6d: false
        ospfd: false
        pimd: false
        ripd: false
        ripngd: false
        zebra: true
      frr_router_id: 1.1.1.1
      frr_password: "{{ _frr_role_defaults.frr_password }}"
      frr_logging: "{{ _frr_role_defaults.frr_logging }}"
      frr_ospf:
        areas:
          0:
            networks:
              - 10.0.0.0/24
      frr_ospf_vrf_enabled:
        blue:
          areas:
            0:
              networks:
                - 10.10.0.0/24
    block:
      - name: Create staging file for OSPF-disabled rendering check
        ansible.builtin.tempfile:
          state: file
          suffix: .frr-ospf-disabled.conf
        register: frr_conf_ospf_disabled_staged
        changed_when: false

      - name: Render frr.conf.j2 with ospfd disabled but OSPF config populated
        ansible.builtin.template:
          src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/etc/frr/frr.conf.j2"
          dest: "{{ frr_conf_ospf_disabled_staged.path }}"
          mode: "0600"
        changed_when: false

      - name: Validate the rendered OSPF-disabled frr.conf with vtysh
        ansible.builtin.command:
          cmd: "vtysh -C -f {{ frr_conf_ospf_disabled_staged.path }}"
        register: frr_conf_ospf_disabled_validation
        changed_when: false

      - name: Assert the rendered OSPF-disabled frr.conf is valid
        ansible.builtin.assert:
          that:
            - frr_conf_ospf_disabled_validation.rc == 0
          fail_msg: "Rendered OSPF-disabled frr.conf failed vtysh validation"

      - name: Slurp the rendered OSPF-disabled frr.conf
        ansible.builtin.slurp:
          src: "{{ frr_conf_ospf_disabled_staged.path }}"
        register: frr_conf_ospf_disabled_slurp

      - name: Assert no router ospf config is rendered when ospfd is disabled
        vars:
          frr_conf_ospf_disabled_content: "{{ frr_conf_ospf_disabled_slurp.content | b64decode }}"
        ansible.builtin.assert:
          that:
            - "'router ospf' not in frr_conf_ospf_disabled_content"
          fail_msg: >-
            Expected no 'router ospf' config to render when
            frr_daemons.ospfd is false, but found some in the rendered
            frr.conf
    always:
      - name: Remove staged OSPF-disabled rendering file
        ansible.builtin.file:
          path: "{{ frr_conf_ospf_disabled_staged.path }}"
          state: absent
        changed_when: false
        when:
          - frr_conf_ospf_disabled_staged is defined
          - frr_conf_ospf_disabled_staged.path is defined

  - name: Render frr.conf for BGP address-family consolidation scenario (based on #155's example)
    vars:
      _frr_role_defaults: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') + '/defaults/main.yml') | from_yaml }}"
      frr_daemons:
        bfdd: false
        bgpd: true
        isisd: false
        ldpd: false
        nhrpd: false
        ospf6d: false
        ospfd: false
        pimd: false
        ripd: false
        ripngd: false
        zebra: true
      frr_router_id: 1.1.1.1
      frr_password: "{{ _frr_role_defaults.frr_password }}"
      frr_logging: "{{ _frr_role_defaults.frr_logging }}"
      frr_no_ebgp_requires_policy: "{{ _frr_role_defaults.frr_no_ebgp_requires_policy }}"
      frr_bgp:
        asns:
          65000:
            maximum_paths: 64
            other:
              - "no bgp default ipv4-unicast"
            af_evpn:
              - "advertise-all-vni"
            neighbors:
              FABRIC:
                asn: 65000
                is_peer_group: true
                other:
                  - "capability extended-nexthop"
                af_v4:
                  - "activate"
                af_v6:
                  - "activate"
                af_evpn:
                  - "activate"
                v4_route_reflector_client: true
                next_hop_self: true
              RR:
                asn: 65000
                is_peer_group: true
                af_v4:
                  - "activate"
                af_evpn:
                  - "activate"
              10.0.0.12:
                is_peer_group: false
                peer_group: RR
              192.168.250.11:
                asn: 65000
                af_v4:
                  - "activate"
            listen_range:
              10.0.0.0/24: FABRIC
            networks:
              - "10.0.0.0/24"
            redistribute:
              - connected
            networks_v6:
              - "2001:db8::/64"
            redistribute_v6:
              - connected
    block:
      - name: Create staging file for BGP address-family consolidation rendering check
        ansible.builtin.tempfile:
          state: file
          suffix: .frr-bgp-af.conf
        register: frr_conf_bgp_af_staged
        changed_when: false

      - name: Render frr.conf.j2 with the BGP address-family consolidation scenario
        ansible.builtin.template:
          src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/etc/frr/frr.conf.j2"
          dest: "{{ frr_conf_bgp_af_staged.path }}"
          mode: "0600"
        changed_when: false

      - name: Validate the rendered BGP address-family frr.conf with vtysh
        ansible.builtin.command:
          cmd: "vtysh -C -f {{ frr_conf_bgp_af_staged.path }}"
        register: frr_conf_bgp_af_validation
        changed_when: false

      - name: Assert the rendered BGP address-family frr.conf is valid
        ansible.builtin.assert:
          that:
            - frr_conf_bgp_af_validation.rc == 0
          fail_msg: >-
            Rendered BGP address-family frr.conf failed vtysh validation:
            {{ frr_conf_bgp_af_validation.stdout }} {{ frr_conf_bgp_af_validation.stderr }}

      - name: Slurp the rendered BGP address-family frr.conf
        ansible.builtin.slurp:
          src: "{{ frr_conf_bgp_af_staged.path }}"
        register: frr_conf_bgp_af_slurp

      - name: Assert exactly one address-family block per address family for the ASN
        vars:
          frr_conf_bgp_af_content: "{{ frr_conf_bgp_af_slurp.content | b64decode }}"
          frr_conf_bgp_af_lines: "{{ frr_conf_bgp_af_content.splitlines() }}"
          frr_conf_bgp_af_v4_lines: "{{ frr_conf_bgp_af_lines | select('equalto', '  address-family ipv4 unicast') | list }}"
          frr_conf_bgp_af_v6_lines: "{{ frr_conf_bgp_af_lines | select('equalto', '  address-family ipv6 unicast') | list }}"
          frr_conf_bgp_af_evpn_lines: "{{ frr_conf_bgp_af_lines | select('equalto', '  address-family l2vpn evpn') | list }}"
        ansible.builtin.assert:
          that:
            - frr_conf_bgp_af_v4_lines | length == 1
            - frr_conf_bgp_af_v6_lines | length == 1
            - frr_conf_bgp_af_evpn_lines | length == 1
          fail_msg: >-
            Expected exactly one address-family block per family for ASN 65000
            but found {{ frr_conf_bgp_af_v4_lines | length }} ipv4 unicast,
            {{ frr_conf_bgp_af_v6_lines | length }} ipv6 unicast, and
            {{ frr_conf_bgp_af_evpn_lines | length }} l2vpn evpn blocks

      - name: Assert the neighbor without is_peer_group set rendered correctly
        vars:
          frr_conf_bgp_af_content: "{{ frr_conf_bgp_af_slurp.content | b64decode }}"
        ansible.builtin.assert:
          that:
            - "'neighbor 192.168.250.11 remote-as 65000' in frr_conf_bgp_af_content"
            - "'neighbor 192.168.250.11 activate' in frr_conf_bgp_af_content"
          fail_msg: >-
            Expected the neighbor with no is_peer_group key set to render
            without error, but its statements were missing from the rendered
            frr.conf
    always:
      - name: Remove staged BGP address-family rendering file
        ansible.builtin.file:
          path: "{{ frr_conf_bgp_af_staged.path }}"
          state: absent
        changed_when: false
        when:
          - frr_conf_bgp_af_staged is defined
          - frr_conf_bgp_af_staged.path is defined

  - name: Render frr.conf for BGP single address-family scenario (only af_v4 populated)
    vars:
      _frr_role_defaults: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') + '/defaults/main.yml') | from_yaml }}"
      frr_daemons:
        bfdd: false
        bgpd: true
        isisd: false
        ldpd: false
        nhrpd: false
        ospf6d: false
        ospfd: false
        pimd: false
        ripd: false
        ripngd: false
        zebra: true
      frr_router_id: 1.1.1.1
      frr_password: "{{ _frr_role_defaults.frr_password }}"
      frr_logging: "{{ _frr_role_defaults.frr_logging }}"
      frr_no_ebgp_requires_policy: "{{ _frr_role_defaults.frr_no_ebgp_requires_policy }}"
      frr_bgp:
        asns:
          65001:
            neighbors:
              192.168.250.11:
                asn: 65001
                af_v4:
                  - "activate"
    block:
      - name: Create staging file for BGP single-address-family rendering check
        ansible.builtin.tempfile:
          state: file
          suffix: .frr-bgp-single-af.conf
        register: frr_conf_bgp_single_af_staged
        changed_when: false

      - name: Render frr.conf.j2 with only af_v4 populated (no af_v6 or af_evpn anywhere)
        ansible.builtin.template:
          src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/etc/frr/frr.conf.j2"
          dest: "{{ frr_conf_bgp_single_af_staged.path }}"
          mode: "0600"
        changed_when: false

      - name: Validate the rendered single-address-family frr.conf with vtysh
        ansible.builtin.command:
          cmd: "vtysh -C -f {{ frr_conf_bgp_single_af_staged.path }}"
        register: frr_conf_bgp_single_af_validation
        changed_when: false

      - name: Assert the rendered single-address-family frr.conf is valid
        ansible.builtin.assert:
          that:
            - frr_conf_bgp_single_af_validation.rc == 0
          fail_msg: >-
            Rendered single-address-family frr.conf failed vtysh validation:
            {{ frr_conf_bgp_single_af_validation.stdout }}
            {{ frr_conf_bgp_single_af_validation.stderr }}

      - name: Slurp the rendered single-address-family frr.conf
        ansible.builtin.slurp:
          src: "{{ frr_conf_bgp_single_af_staged.path }}"
        register: frr_conf_bgp_single_af_slurp

      - name: Assert no empty address-family blocks or stray None values rendered
        vars:
          frr_conf_bgp_single_af_content: "{{ frr_conf_bgp_single_af_slurp.content | b64decode }}"
          frr_conf_bgp_single_af_lines: "{{ frr_conf_bgp_single_af_content.splitlines() }}"
        ansible.builtin.assert:
          that:
            - "'None' not in frr_conf_bgp_single_af_content"
            - (frr_conf_bgp_single_af_lines | select('equalto', '  address-family ipv6 unicast') | list | length) == 0
            - (frr_conf_bgp_single_af_lines | select('equalto', '  address-family l2vpn evpn') | list | length) == 0
            - (frr_conf_bgp_single_af_lines | select('equalto', '  address-family ipv4 unicast') | list | length) == 1
          fail_msg: >-
            Expected only an ipv4 unicast address-family block with no stray
            'None' text when af_v6/af_evpn are unused anywhere in the ASN
    always:
      - name: Remove staged BGP single-address-family rendering file
        ansible.builtin.file:
          path: "{{ frr_conf_bgp_single_af_staged.path }}"
          state: absent
        changed_when: false
        when:
          - frr_conf_bgp_single_af_staged is defined
          - frr_conf_bgp_single_af_staged.path is defined
